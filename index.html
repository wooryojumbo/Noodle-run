<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>국시런 (KuksiRun) - 한의사 국가고시 러닝 메이트</title>
  
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="shortcut icon" href="icon.png">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@1.0/nanumsquare.css">
  
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <style>
    :root {
      --primary-color: #fcd4d4;
      --primary-text: #5a3d3d;
      --accent-color: #f8afaf;
      --accent-hover: #f59696;
      --bg-color: #fff9f9;
      --card-bg: #ffffff;
      --border-color: #f2d6d6;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'NanumSquare', sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: #333;
    }

    .top-bar {
      background-color: var(--primary-color);
      color: var(--primary-text);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .brand-logo { display: flex; align-items: center; gap: 8px; }
    .brand-icon-img {
      width: 38px;
      height: 38px;
      object-fit: contain;
      background-color: #ffffff;
      border-radius: 10px;
      padding: 0px;
      vertical-align: middle;
    }
    .brand-title { font-weight: bold; font-size: 18px; color: var(--primary-text); }
    .brand-subtitle { font-size: 10pt; color: #c4bebe; margin-left: 4px; }
    .top-center-title { font-weight: bold; font-size: 17px; position: absolute; left: 50%; transform: translateX(-50%); }

    @media (max-width: 768px) {
      .top-center-title { display: none; }
    }

    .top-right-actions { display: flex; align-items: center; gap: 12px; }
    .dday-badge { background: #ffffff; color: #d63031; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 13px; }

    nav {
      background-color: #ffffff;
      border-bottom: 2px solid var(--border-color);
      display: flex;
      justify-content: center;
      overflow-x: auto;
    }

    nav button {
      background: none;
      border: none;
      color: #777;
      padding: 14px 28px;
      font-size: 16px;
      cursor: pointer;
      white-space: nowrap;
      border-bottom: 3px solid transparent;
      font-family: 'NanumSquare', sans-serif;
    }

    nav button.active {
      color: var(--primary-text);
      border-bottom: 3px solid var(--accent-color);
      background-color: #fff5f5;
      font-weight: bold;
    }

    main { max-width: 1200px; margin: 25px auto; padding: 0 15px; }

    .page-content {
      display: none;
      background: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(248, 175, 175, 0.15);
      border: 1px solid var(--border-color);
    }
    .page-content.active { display: block !important; }

    .btn-timer {
      padding: 8px 14px;
      border: 1px solid var(--accent-color);
      background: #ffffff;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-family: 'NanumSquare', sans-serif;
    }
    .btn-timer:hover { background: #fff0f0; }

    .calendar-container { border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; background: #ffffff; }
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--border-color); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
    .cal-day-header { background: #fff0f0; padding: 8px; text-align: center; font-weight: bold; font-size: 12px; color: var(--primary-text); }
    .cal-cell { background: #ffffff; min-height: 100px; padding: 4px; display: flex; flex-direction: column; cursor: pointer; }
    .cal-cell.other-month { background: #fafafa; opacity: 0.4; cursor: default; }

    .cal-cell.is-today { background-color: #e3f2ce !important; }
    .cal-cell.all-completed { background-color: #f1ddc0 !important; }
    .cal-cell.exam-day { background-color: #fbfbb5 !important; }

    .cal-date-header { display: flex; align-items: center; gap: 4px; margin-bottom: 2px; }
    .cal-date-num { font-size: 11px; font-weight: bold; }
    .cal-exam-label { font-size: 11px; font-weight: bold; color: #d63031; }

    .cal-todo-list { list-style: none; padding: 0; margin: 0; flex: 1; overflow-y: auto; }
    .cal-todo-item { font-size: 10px; display: flex; align-items: center; gap: 2px; margin-bottom: 2px; }

    .flashcard { position: relative; width: 100%; height: 280px; perspective: 1000px; cursor: pointer; margin: 15px 0; user-select: none; }
    .flashcard-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.5s; transform-style: preserve-3d; box-shadow: 0 4px 15px rgba(248, 175, 175, 0.3); border-radius: 12px; border: 2px solid var(--accent-color); }
    .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
    .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; font-size: 18px; font-weight: bold; border-radius: 10px; }
    .card-back { background-color: #fff9f9; color: #d63031; transform: rotateY(180deg); }
    .star-badge { 
      position: absolute; 
      top: 12px; 
      left: 15px; 
      font-size: 24px; 
      cursor: pointer; 
      z-index: 20;
      pointer-events: auto;
      transform: translateZ(1px);
    }

    .touch-zone-left, .touch-zone-right { position: absolute; top: 0; bottom: 0; width: 25%; z-index: 5; pointer-events: none; }
    .touch-zone-left { left: 0; }
    .touch-zone-right { right: 0; }

    .btn-pink { background-color: var(--accent-color) !important; color: white !important; border: none !important; font-weight: bold; cursor: pointer; }
    .close-btn { position: absolute; right: 15px; top: 15px; border: none; background: none; font-size: 22px; cursor: pointer; z-index: 20; }

    .quizlet-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 12px; }
    .quizlet-table th, .quizlet-table td { border: 1px solid var(--border-color); padding: 6px; text-align: left; }
    .quizlet-table th { background: #fff0f0; }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 2500;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: white;
      width: 520px;
      max-width: 95%;
      max-height: 90vh;
      padding: 25px;
      border-radius: 12px;
      position: relative;
      border: 2px solid var(--accent-color);
      overflow-y: auto;
    }

    .schedule-date-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
      background: #fff0f0;
      padding: 10px 15px;
      border-radius: 8px;
    }
    .schedule-date-picker {
      padding: 6px 10px;
      border: 1px solid var(--accent-color);
      border-radius: 6px;
      font-family: 'NanumSquare', sans-serif;
      font-size: 15px;
      font-weight: bold;
      color: var(--primary-text);
      outline: none;
      background: #ffffff;
    }

    /* 3페이지 세부 일정 전용 스타일 */
    .todo-input-container {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    .todo-input {
      flex: 1;
      padding: 12px 15px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 15px;
      font-family: 'NanumSquare', sans-serif;
      outline: none;
    }
    .todo-input:focus {
      border-color: var(--accent-color);
    }
    .todo-list-box {
      min-height: 320px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      background: #ffffff;
      list-style: none;
      margin: 0;
    }
    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between; /* 좌측(체크박스/항목) - 우측(색깔/드래그/삭제) 분리 */
      padding: 10px;
      margin-bottom: 6px;
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 15px;
      gap: 12px;
      transition: background 0.2s, box-shadow 0.2s, opacity 0.2s;
    }
    .todo-item.dragging {
      opacity: 0.4;
      background: #fff0f0;
      border-style: dashed;
      border-color: var(--accent-color);
    }

    /* 좌측 영역: 체크박스 + 항목 */
    .todo-item-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }

    /* 우측 영역: 색깔 + 드래그 + 삭제버튼 */
    .todo-item-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .todo-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--accent-color);
    }
    .color-picker-btn {
      cursor: pointer;
      font-size: 14px;
      user-select: none;
      padding: 2px 4px;
      border-radius: 4px;
      background: #f7f7f7;
    }
    .color-picker-btn:hover {
      background: #eee;
    }
    .drag-handle {
      cursor: grab;
      color: #aaa;
      font-size: 16px;
      padding: 0 4px;
      user-select: none;
    }
    .drag-handle:active {
      cursor: grabbing;
    }
    .todo-text {
      cursor: pointer;
      user-select: none;
      flex: 1;
      padding: 2px 4px;
      border-radius: 4px;
    }
    .todo-text:hover {
      background: #fff0f0;
    }
    .todo-text.completed {
      text-decoration: line-through;
      opacity: 0.5;
    }
    .todo-text-input {
      flex: 1;
      font-size: 15px;
      font-family: 'NanumSquare', sans-serif;
      padding: 4px 8px;
      border: 1px solid var(--accent-color);
      border-radius: 4px;
      outline: none;
    }
    .todo-delete-btn {
      background: none;
      border: none;
      color: #e74c3c;
      font-weight: bold;
      cursor: pointer;
      padding: 2px 6px;
      font-size: 16px;
    }
    .empty-todo-msg {
      text-align: center;
      color: #999;
      padding: 40px 0;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="brand-logo">
      <img src="icon.png" alt="로고" class="brand-icon-img">
      <span class="brand-title">국시런</span>
      <span class="brand-subtitle">for noonso</span>
    </div>
    <div class="top-center-title"><b>한의사 국가고시 러닝 메이트</b></div>
    <div class="top-right-actions">
      <div class="dday-badge" id="dday-display">국시 D-Day</div>
    </div>
  </div>

  <header>
    <nav>
      <button class="tab-btn active" onclick="openTab(event, 'tab1')"><b>나의 플래너</b></button>
      <button class="tab-btn" onclick="openTab(event, 'tab2')"><b>나의 퀴즐렛</b></button>
      <button class="tab-btn" onclick="openTab(event, 'tab3')"><b>오늘의 일정</b></button>
    </nav>
  </header>

  <main>
    <!-- 1페이지: 나의 플래너 (캘린더) -->
    <div id="tab1" class="page-content active">
      <div class="calendar-container">
        <div class="calendar-header">
          <button class="btn-timer" onclick="changeMonth(-1)">◀ 이전 달</button>
          <div style="display:flex; align-items:center; gap:12px;">
            <h3 id="cal-month-title" style="margin:0; color:var(--primary-text); font-size:18px;">2026년 9월</h3>
          </div>
          <button class="btn-timer" onclick="changeMonth(1)">다음 달 ▶</button>
        </div>
        <div class="calendar-grid">
          <div class="cal-day-header">월</div>
          <div class="cal-day-header">화</div>
          <div class="cal-day-header">수</div>
          <div class="cal-day-header">목</div>
          <div class="cal-day-header">금</div>
          <div class="cal-day-header">토</div>
          <div class="cal-day-header">일</div>
        </div>
        <div class="calendar-grid" id="cal-cells-grid" style="border-top:none;"></div>
      </div>
    </div>

    <!-- 2페이지: 나의 퀴즐렛 -->
    <div id="tab2" class="page-content">
      <h2 style="font-size:20px; margin-top:0; color:var(--primary-text);">⭐ 국가고시 스마트 퀴즐렛</h2>
      
      <div class="quizlet-filter-bar" style="display:flex; gap:8px; flex-wrap:wrap; background:#fff0f0; padding:10px; border-radius:8px; margin-bottom:15px;">
        <select id="filter-category" onchange="filterQuizlet()" style="flex:2; padding:6px; border-radius:6px; border:1px solid var(--border-color);"></select>
        <select id="filter-star" onchange="filterQuizlet()" style="flex:1; padding:6px; border-radius:6px; border:1px solid var(--border-color);">
          <option value="ALL">전체 중요도</option>
          <option value="❤️">❤️ (상)</option>
          <option value="💙">💙 (중)</option>
          <option value="💛">💛 (하)</option>
          <option value="🤍">🤍 (기본)</option>
        </select>
        <select id="sort-star" onchange="filterQuizlet()" style="flex:1; padding:6px; border-radius:6px; border:1px solid var(--border-color);">
          <option value="NONE">정렬 기준</option>
          <option value="DESC">높은순 (❤️▶🤍)</option>
          <option value="ASC">낮은순 (🤍▶❤️)</option>
        </select>
        <button onclick="toggleShuffle()" id="shuffle-btn" class="btn-timer" style="padding:6px 12px;">🔀 셔플: OFF</button>
      </div>

      <div class="flashcard" id="main-flashcard" onclick="handleCardTouch(event, this)">
        <div class="touch-zone-left" title="이전 카드"></div>
        <div class="touch-zone-right" title="다음 카드"></div>
        <div class="flashcard-inner">
          <div class="card-front">
            <span class="star-badge" id="card-star" onclick="cycleStar(event)">❤️</span>
            <div id="card-q">질문이 표시됩니다.</div>
            <div style="position:absolute; bottom:8px; font-size:11px; color:#aaa; font-weight:normal;">👈 왼쪽 25%: 이전 | 중앙: 뒤집기 | 오른쪽 25%: 다음 👉</div>
          </div>
          <div class="card-back">
            <div id="card-a">정답이 표시됩니다.</div>
          </div>
        </div>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
        <button class="btn-timer" onclick="prevCard()">◀ 이전</button>
        <span id="card-indicator" style="font-weight:bold; font-size:14px; color:var(--primary-text);">0 / 0</span>
        <button class="btn-timer" onclick="nextCard()">다음 ▶</button>
      </div>

      <div style="display:flex; justify-content:space-between; margin-top:20px;">
        <button class="btn-pink" onclick="openCardAddModal()" style="padding:8px 16px; border-radius:6px;">➕ 새 카드 추가</button>
        <button onclick="toggleCardListView()" style="background:#f1f2f6; border:1px solid #ccc; padding:8px 16px; border-radius:6px; cursor:pointer; font-weight:bold;">📋 편집 및 카드목록 관리</button>
      </div>

      <div id="quizlet-list-view" style="display:none; margin-top:20px;">
        <h3 style="font-size:15px; color:var(--primary-text); margin-bottom:8px;">카드 목록 편집</h3>
        <table class="quizlet-table">
          <thead>
            <tr>
              <th style="width:80px;">중요도</th>
              <th style="width:130px;">과목</th>
              <th>문제 (앞면)</th>
              <th>정답 (뒷면)</th>
              <th style="width:50px;">삭제</th>
            </tr>
          </thead>
          <tbody id="quizlet-table-body"></tbody>
        </table>
      </div>
    </div>

    <!-- 3페이지: 오늘의 일정 -->
    <div id="tab3" class="page-content">
      <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; margin-bottom:10px;">
        <h2 style="font-size:20px; margin:0; color:var(--primary-text);">📅 오늘의 세부 일정</h2>
      </div>

      <div class="schedule-date-bar">
        <button class="btn-timer" onclick="shiftDetailDate(-1)">◀ 어제</button>
        <div style="display:flex; align-items:center; gap:8px;">
          <input type="date" id="schedule-date-picker" class="schedule-date-picker" onchange="onDetailDateChange(this.value)">
        </div>
        <button class="btn-timer" onclick="shiftDetailDate(1)">내일 ▶</button>
      </div>

      <!-- 새 할 일 입력 -->
      <div class="todo-input-container">
        <input type="text" id="new-todo-input" class="todo-input" placeholder="오늘 세울 자유 일정을 입력하세요..." onkeydown="if(event.key==='Enter') addDetailTodo()">
        <button class="btn-pink" onclick="addDetailTodo()" style="padding:0 20px; border-radius:8px; font-size:15px;">추가</button>
      </div>

      <!-- 세부 일정 체크리스트 목록 -->
      <ul id="detail-todo-list" class="todo-list-box"></ul>
    </div>
  </main>

  <!-- 암기 카드 추가 모달 -->
  <div id="card-add-modal" class="modal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeCardAddModal()">✕</button>
      <h3 style="color:var(--primary-text); margin-top:0;">➕ 새 암기카드 추가</h3>
      <div style="margin-bottom:10px;">
        <label style="font-size:12px; font-weight:bold;">과목 선택</label>
        <select id="modal-new-cat" style="width:100%; padding:6px; border:1px solid var(--border-color); border-radius:6px; margin-top:4px;"></select>
      </div>
      <div style="margin-bottom:10px;">
        <label style="font-size:12px; font-weight:bold;">중요도 선택</label>
        <select id="modal-new-star" style="width:100%; padding:6px; border:1px solid var(--border-color); border-radius:6px; margin-top:4px;">
          <option value="❤️">❤️ (상)</option>
          <option value="💙">💙 (중)</option>
          <option value="💛">💛 (하)</option>
          <option value="🤍">🤍 (기본)</option>
        </select>
      </div>
      <div style="margin-bottom:10px;">
        <label style="font-size:12px; font-weight:bold;">문제 (앞면)</label>
        <textarea id="modal-new-q" style="width:100%; height:80px; padding:6px; border:1px solid var(--border-color); border-radius:6px; resize:none; margin-top:4px; font-family:'NanumSquare', sans-serif;"></textarea>
      </div>
      <div style="margin-bottom:14px;">
        <label style="font-size:12px; font-weight:bold;">정답 (뒷면)</label>
        <textarea id="modal-new-a" style="width:100%; height:80px; padding:6px; border:1px solid var(--border-color); border-radius:6px; resize:none; margin-top:4px; font-family:'NanumSquare', sans-serif;"></textarea>
      </div>
      <button class="btn-pink" onclick="submitNewCardModal()" style="width:100%; padding:10px; border-radius:6px;">카드 저장하기</button>
    </div>
  </div>

  <!-- 플래너 모달 -->
  <div id="planner-modal" class="modal">
    <div class="modal-content">
      <button class="close-btn" onclick="closePlannerModal()">✕</button>
      <h3 style="color:var(--primary-text); margin-top:0;" id="planner-modal-date">📅 체크리스트</h3>
      <p style="font-size:12px; color:#666; margin-bottom:10px;"><code>[]</code> 입력 후 <b>Space 키</b>를 누르면 체크박스가 자동 생성됩니다.</p>
      <textarea id="planner-bulk-textarea" style="width:100%; height:200px; padding:10px; border:1px solid var(--border-color); border-radius:8px; font-size:13px; resize:vertical; outline:none; font-family:'NanumSquare', sans-serif;" onkeydown="handleCheckboxShortcut(event)"></textarea>
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:12px;">
        <button onclick="closePlannerModal()" style="padding:6px 14px; border:1px solid #ccc; background:#fff; border-radius:6px; cursor:pointer;">취소</button>
        <button class="btn-pink" onclick="savePlannerBulkItems()" style="padding:6px 18px; border-radius:6px;">💾 저장</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://kuksi-run-default-rtdb.firebaseio.com/"
    };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();

    const examSchedule = {
      "2026-09-19": "1차",
      "2026-10-10": "2차",
      "2026-10-31": "3차",
      "2026-11-21": "4차",
      "2026-12-12": "5차",
      "2026-12-26": "6차",
      "2027-01-02": "7차",
      "2027-01-08": "8차",
      "2027-01-15": "국가고시"
    };

    function syncSave(key, val) {
      localStorage.setItem(key, typeof val === 'object' ? JSON.stringify(val) : val);
      db.ref(key).set(val);
    }

    function getLocalDateKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function updateDday() {
      const targetDate = new Date('2027-01-15T00:00:00');
      const diffTime = targetDate - new Date();
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      const ddayStr = `국시 D-${diffDays > 0 ? diffDays : 'Day'}`;
      document.getElementById('dday-display').innerText = ddayStr;
    }

    function openTab(evt, tabId) {
      const contents = document.getElementsByClassName('page-content');
      for (let i = 0; i < contents.length; i++) {
        contents[i].classList.remove('active');
        contents[i].style.display = 'none';
      }
      
      const btns = document.querySelectorAll('nav button');
      for (let i = 0; i < btns.length; i++) {
        btns[i].classList.remove('active');
      }

      const target = document.getElementById(tabId);
      if (target) {
        target.classList.add('active');
        target.style.display = 'block';
      }
      if (evt && evt.currentTarget) {
        evt.currentTarget.classList.add('active');
      }
    }

    const subjectList = [
      "간계내과", "심계내과", "비계내과", "폐계내과", "신계내과",
      "상한론", "사상의학", "침구학", "의료법규", "한방외과",
      "신경정신과", "안이비인후과", "한방소아과",
      "예방의학", "한방생리학", "본초학"
    ];

    let currentCalDate = new Date();

    function renderCalendar() {
      const year = currentCalDate.getFullYear();
      const month = currentCalDate.getMonth();
      document.getElementById('cal-month-title').innerText = `${year}년 ${month + 1}월`;

      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);

      let startDay = firstDay.getDay() - 1;
      if (startDay === -1) startDay = 6;

      const grid = document.getElementById('cal-cells-grid');
      if (!grid) return;
      grid.innerHTML = '';

      const todayKey = getLocalDateKey(new Date());

      for (let i = 0; i < startDay; i++) {
        grid.innerHTML += `<div class="cal-cell other-month"></div>`;
      }

      for (let day = 1; day <= lastDay.getDate(); day++) {
        const dateObj = new Date(year, month, day);
        const dateKey = getLocalDateKey(dateObj);

        const todos = JSON.parse(localStorage.getItem(`todos_v2_${dateKey}`)) || [];
        
        const isToday = (dateKey === todayKey);
        const hasTodos = todos.length > 0;
        const allDone = hasTodos && todos.every(t => t.done);
        const examLabel = examSchedule[dateKey] || '';

        let bgClass = '';
        if (examLabel) {
          bgClass = 'exam-day';
        } else if (allDone) {
          bgClass = 'all-completed';
        } else if (isToday) {
          bgClass = 'is-today';
        }

        let todoHTML = todos.map((t, idx) => {
          let textColor = t.color === 'red' ? '#e74c3c' : (t.color === 'blue' ? '#2980b9' : '#333333');
          return `
          <li class="cal-todo-item" onclick="event.stopPropagation();">
            <input type="checkbox" ${t.done ? 'checked' : ''} style="pointer-events: auto; cursor: pointer;" onchange="toggleTodo('${dateKey}', ${idx}, event)">
            <span onclick="toggleTodo('${dateKey}', ${idx}, event)" style="cursor: pointer; color:${textColor}; ${t.done ? 'text-decoration:line-through; opacity:0.5;' : ''}">${t.text}</span>
          </li>
        `}).join('');

        const examLabelHTML = examLabel ? `<span class="cal-exam-label">${examLabel}</span>` : '';

        grid.innerHTML += `
          <div class="cal-cell ${bgClass}" onclick="openPlannerModal('${dateKey}')">
            <div class="cal-date-header">
              <span class="cal-date-num">${day}</span>
              ${examLabelHTML}
            </div>
            <ul class="cal-todo-list">${todoHTML}</ul>
          </div>
        `;
      }
    }

    function toggleTodo(dateKey, idx, evt) {
      if (evt) {
        evt.stopPropagation();
      }
      const todos = JSON.parse(localStorage.getItem(`todos_v2_${dateKey}`)) || [];
      if (todos[idx]) {
        todos[idx].done = !todos[idx].done;
        syncSave(`todos_v2_${dateKey}`, todos);
        renderCalendar();
      }
    }

    function changeMonth(offset) {
      currentCalDate.setMonth(currentCalDate.getMonth() + offset, 1);
      renderCalendar();
    }

    let activePlannerDateKey = '';
    function openPlannerModal(dateKey) {
      activePlannerDateKey = dateKey;
      document.getElementById('planner-modal-date').innerText = `📅 ${dateKey} 체크리스트`;
      document.getElementById('planner-modal').style.display = 'flex';
      const todos = JSON.parse(localStorage.getItem(`todos_v2_${dateKey}`)) || [];
      document.getElementById('planner-bulk-textarea').value = todos.map(t => `${t.done ? '☑' : '☐'} ${t.text}`).join('\n');
    }

    function closePlannerModal() { document.getElementById('planner-modal').style.display = 'none'; renderCalendar(); }

    function handleCheckboxShortcut(e) {
      const textarea = e.target;
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const val = textarea.value;

      if (e.key === ' ') {
        if (start >= 2 && val.substring(start - 2, start) === '[]') {
          e.preventDefault();
          textarea.value = val.substring(0, start - 2) + '☐ ' + val.substring(end);
          textarea.selectionStart = textarea.selectionEnd = start;
          return;
        }
      }

      if (e.key === 'Tab') {
        e.preventDefault();
        const lineStart = val.lastIndexOf('\n', start - 1) + 1;
        if (e.shiftKey) {
          if (val.substring(lineStart, lineStart + 4) === '    ') {
            textarea.value = val.substring(0, lineStart) + val.substring(lineStart + 4);
            textarea.selectionStart = textarea.selectionEnd = Math.max(lineStart, start - 4);
          }
        } else {
          textarea.value = val.substring(0, lineStart) + '    ' + val.substring(lineStart);
          textarea.selectionStart = textarea.selectionEnd = start + 4;
        }
        return;
      }

      if (e.key === 'Enter') {
        const lineStart = val.lastIndexOf('\n', start - 1) + 1;
        const currentLine = val.substring(lineStart, start);
        const match = currentLine.match(/^(\s*)(☐|☑|\[\s*\]|\[[xX]\])\s*/);

        if (match) {
          e.preventDefault();
          const indent = match[1];
          const nextBox = '\n' + indent + '☐ ';

          if (currentLine.trim() === '☐' || currentLine.trim() === '☑' || currentLine.trim() === '[ ]' || currentLine.trim() === '[x]') {
            textarea.value = val.substring(0, lineStart) + val.substring(start);
            textarea.selectionStart = textarea.selectionEnd = lineStart;
            return;
          }

          textarea.value = val.substring(0, start) + nextBox + val.substring(end);
          textarea.selectionStart = textarea.selectionEnd = start + nextBox.length;
        }
      }
    }

    function savePlannerBulkItems() {
      const lines = document.getElementById('planner-bulk-textarea').value.split('\n');
      const todos = [];
      lines.forEach(line => {
        const trimmed = line.trim();
        if (!trimmed) return;
        if (trimmed.startsWith('☑') || trimmed.startsWith('[x]') || trimmed.startsWith('[X]')) {
          todos.push({ text: trimmed.replace(/^(☑|\[[xX]\])\s*/, ''), done: true, color: 'black' });
        } else {
          todos.push({ text: trimmed.replace(/^(☐|\[\s*\])\s*/, ''), done: false, color: 'black' });
        }
      });
      syncSave(`todos_v2_${activePlannerDateKey}`, todos);
      closePlannerModal();
    }

    const starList = ['❤️', '💙', '💛', '🤍'];
    const starWeights = { '❤️': 4, '💙': 3, '💛': 2, '🤍': 1 };

    let cards = JSON.parse(localStorage.getItem('quizlet_cards_v5')) || [
      { cat: "간계내과", star: "❤️", q: "간주소설(肝主疏泄)의 핵심 기전은?", a: "기기(氣機)의 조창 및 기혈 운행 조절" },
      { cat: "상한론", star: "💙", q: "태음병(太陰病)의 주증은?", a: "복만이토, 식불하, 자하리익심" }
    ];
    let filteredCards = [];
    let cardIdx = 0;
    let isShuffle = false;

    function initCategoryOptions() {
      const opts = subjectList.map(s => `<option value="${s}">${s}</option>`).join('');
      document.getElementById('modal-new-cat').innerHTML = opts;
      document.getElementById('filter-category').innerHTML = `<option value="ALL">전체 과목 보기</option>` + opts;
    }

    function filterQuizlet() {
      const cat = document.getElementById('filter-category').value;
      const star = document.getElementById('filter-star').value;
      const sortOrder = document.getElementById('sort-star').value;

      filteredCards = cards.filter(c => (cat === 'ALL' || c.cat === cat) && (star === 'ALL' || c.star === star));

      if (sortOrder === 'DESC') filteredCards.sort((a, b) => starWeights[b.star] - starWeights[a.star]);
      else if (sortOrder === 'ASC') filteredCards.sort((a, b) => starWeights[a.star] - starWeights[b.star]);
      if (isShuffle) filteredCards.sort(() => Math.random() - 0.5);

      cardIdx = 0;
      updateCard();
      renderCardTable();
    }

    function toggleShuffle() {
      isShuffle = !isShuffle;
      const btn = document.getElementById('shuffle-btn');
      btn.innerText = `🔀 셔플: ${isShuffle ? 'ON' : 'OFF'}`;
      filterQuizlet();
    }

    function handleCardTouch(evt, el) {
      if (evt.target.classList.contains('star-badge') || evt.target.closest('.star-badge')) {
        return;
      }
      
      const rect = el.getBoundingClientRect();
      const clickX = evt.clientX - rect.left;
      const width = rect.width;

      if (clickX < width * 0.25) {
        prevCard();
      } else if (clickX > width * 0.75) {
        nextCard();
      } else {
        el.classList.toggle('flipped');
      }
    }

    function updateCard() {
      if (filteredCards.length === 0) {
        document.getElementById('card-q').innerText = "해당 카드가 없습니다.";
        document.getElementById('card-a').innerText = "새 카드를 추가해보세요.";
        document.getElementById('card-indicator').innerText = "0 / 0";
        return;
      }
      const c = filteredCards[cardIdx];
      document.getElementById('card-q').innerText = c.q;
      document.getElementById('card-a').innerText = c.a;
      
      const starEl = document.getElementById('card-star');
      if (starEl) {
        starEl.innerText = c.star || "❤️";
      }

      document.getElementById('card-indicator').innerText = `${cardIdx + 1} / ${filteredCards.length}`;
      document.getElementById('main-flashcard').classList.remove('flipped');
    }

    function cycleStar(evt) {
      if (evt) {
        evt.stopPropagation();
        evt.preventDefault();
      }

      if (!filteredCards || filteredCards.length === 0) return;

      const currentCard = filteredCards[cardIdx];
      if (!currentCard) return;

      const originalIdx = cards.findIndex(c => c.q === currentCard.q && c.a === currentCard.a);
      if (originalIdx === -1) return;

      const currentStar = cards[originalIdx].star || '❤️';
      const currentStarIdx = starList.indexOf(currentStar);
      const nextStar = starList[(currentStarIdx + 1) % starList.length];

      cards[originalIdx].star = nextStar;
      currentCard.star = nextStar;

      syncSave('quizlet_cards_v5', cards);
      updateCard();
      if (typeof renderCardTable === 'function') {
        renderCardTable();
      }
    }

    function prevCard() { if (cardIdx > 0) { cardIdx--; updateCard(); } }
    function nextCard() { if (cardIdx < filteredCards.length - 1) { cardIdx++; updateCard(); } }

    function openCardAddModal() { document.getElementById('card-add-modal').style.display = 'flex'; }
    function closeCardAddModal() { document.getElementById('card-add-modal').style.display = 'none'; }

    function submitNewCardModal() {
      const cat = document.getElementById('modal-new-cat').value;
      const star = document.getElementById('modal-new-star').value;
      const q = document.getElementById('modal-new-q').value;
      const a = document.getElementById('modal-new-a').value;

      if (q && a) {
        cards.push({ cat, star, q, a });
        syncSave('quizlet_cards_v5', cards);
        closeCardAddModal();
        document.getElementById('modal-new-q').value = '';
        document.getElementById('modal-new-a').value = '';
        filterQuizlet();
      }
    }

    function toggleCardListView() {
      const v = document.getElementById('quizlet-list-view');
      v.style.display = v.style.display === 'block' ? 'none' : 'block';
    }

    function renderCardTable() {
      const tbody = document.getElementById('quizlet-table-body');
      if (!tbody) return;
      tbody.innerHTML = '';
      
      cards.forEach((c, idx) => {
        const starSelectHTML = `
          <select onchange="updateCardField(${idx}, 'star', this.value)" style="padding:4px; border-radius:4px; border:1px solid var(--border-color);">
            ${starList.map(s => `<option value="${s}" ${c.star === s ? 'selected' : ''}>${s}</option>`).join('')}
          </select>
        `;

        const catSelectHTML = `
          <select onchange="updateCardField(${idx}, 'cat', this.value)" style="padding:4px; border-radius:4px; border:1px solid var(--border-color); width:100%;">
            ${subjectList.map(sub => `<option value="${sub}" ${c.cat === sub ? 'selected' : ''}>${sub}</option>`).join('')}
          </select>
        `;

        tbody.innerHTML += `
          <tr>
            <td style="text-align:center;">${starSelectHTML}</td>
            <td>${catSelectHTML}</td>
            <td><textarea onchange="updateCardField(${idx}, 'q', this.value)" style="width:100%; height:42px; font-family:'NanumSquare', sans-serif; resize:none; padding:6px; border:1px solid var(--border-color); border-radius:4px; box-sizing:border-box;">${c.q}</textarea></td>
            <td><textarea onchange="updateCardField(${idx}, 'a', this.value)" style="width:100%; height:42px; font-family:'NanumSquare', sans-serif; resize:none; padding:6px; border:1px solid var(--border-color); border-radius:4px; box-sizing:border-box;">${c.a}</textarea></td>
            <td style="text-align:center;"><button onclick="deleteCard(${idx})" style="background:#e74c3c; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">✕</button></td>
          </tr>
        `;
      });
    }

    function updateCardField(idx, field, val) {
      cards[idx][field] = val;
      syncSave('quizlet_cards_v5', cards);
      filterQuizlet();
    }

    function deleteCard(idx) {
      if (confirm('이 암기 카드를 삭제하시겠습니까?')) {
        cards.splice(idx, 1);
        syncSave('quizlet_cards_v5', cards);
        filterQuizlet();
      }
    }

    /* --- 3페이지 독립형 세부 일정 모듈 --- */
    let currentDetailDateStr = getLocalDateKey(new Date());
    let editingTodoIdx = -1;
    let draggedIdx = null;

    function initScheduleDatePicker() {
      const picker = document.getElementById('schedule-date-picker');
      if (picker) {
        picker.value = currentDetailDateStr;
      }
      renderDetailTodoList();
    }

    function onDetailDateChange(newDateStr) {
      if (!newDateStr) return;
      currentDetailDateStr = newDateStr;
      editingTodoIdx = -1;
      renderDetailTodoList();
    }

    function shiftDetailDate(offsetDays) {
      const parts = currentDetailDateStr.split('-');
      const targetDate = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
      targetDate.setDate(targetDate.getDate() + offsetDays);

      currentDetailDateStr = getLocalDateKey(targetDate);
      document.getElementById('schedule-date-picker').value = currentDetailDateStr;
      editingTodoIdx = -1;
      renderDetailTodoList();
    }

    /* 레이아웃 변경: [체크박스][항목] (좌측) | [색깔][드래그앤드롭][삭제버튼] (우측) */
    function renderDetailTodoList() {
      const listEl = document.getElementById('detail-todo-list');
      if (!listEl) return;

      const todos = JSON.parse(localStorage.getItem(`daily_detail_${currentDetailDateStr}`)) || [];
      listEl.innerHTML = '';

      if (todos.length === 0) {
        listEl.innerHTML = `<li class="empty-todo-msg">등록된 세부 일정이 없습니다. 위 입력창에 오늘의 계획을 자유롭게 추가해보세요!</li>`;
        return;
      }

      todos.forEach((t, idx) => {
        const itemColor = t.color || 'black';
        let colorIcon = '🖤';
        let textColor = '#333333';

        if (itemColor === 'red') {
          colorIcon = '🔴';
          textColor = '#e74c3c';
        } else if (itemColor === 'blue') {
          colorIcon = '🔵';
          textColor = '#2980b9';
        }

        const isEditing = (editingTodoIdx === idx);

        let textHTML = '';
        if (isEditing) {
          textHTML = `<input type="text" id="edit-todo-input-${idx}" class="todo-text-input" value="${t.text.replace(/"/g, '&quot;')}" onkeydown="if(event.key==='Enter') saveEditedTodo(${idx})" onblur="saveEditedTodo(${idx})">`;
        } else {
          textHTML = `<span class="todo-text ${t.done ? 'completed' : ''}" style="color:${textColor};" onclick="startEditTodo(${idx})" title="클릭하여 수정">${t.text}</span>`;
        }

        listEl.innerHTML += `
          <li class="todo-item" draggable="true" data-index="${idx}" ondragstart="handleDragStart(event, ${idx})" ondragover="handleDragOver(event)" ondrop="handleDrop(event, ${idx})" ondragend="handleDragEnd(event)">
            <!-- 좌측: 체크박스 / 항목 -->
            <div class="todo-item-left">
              <input type="checkbox" class="todo-checkbox" ${t.done ? 'checked' : ''} onchange="toggleDetailTodo(${idx})">
              ${textHTML}
            </div>
            <!-- 우측: 색깔 / 드래그 / 삭제버튼 -->
            <div class="todo-item-right">
              <span class="color-picker-btn" onclick="cycleTodoColor(${idx})" title="색상 변경 (검정▶빨강▶파랑)">${colorIcon}</span>
              <span class="drag-handle" title="꾹 눌러서 위아래로 순서 변경">☰</span>
              <button class="todo-delete-btn" onclick="deleteDetailTodo(${idx})" title="삭제">✕</button>
            </div>
          </li>
        `;
      });

      if (editingTodoIdx !== -1) {
        setTimeout(() => {
          const editInput = document.getElementById(`edit-todo-input-${editingTodoIdx}`);
          if (editInput) editInput.focus();
        }, 50);
      }
    }

    function handleDragStart(e, idx) {
      draggedIdx = idx;
      e.currentTarget.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    }

    function handleDrop(e, targetIdx) {
      e.preventDefault();
      if (draggedIdx === null || draggedIdx === targetIdx) return;

      const todos = JSON.parse(localStorage.getItem(`daily_detail_${currentDetailDateStr}`)) || [];
      const movedItem = todos.splice(draggedIdx, 1)[0];
      todos.splice(targetIdx, 0, movedItem);

      draggedIdx = null;
      syncSave(`daily_detail_${currentDetailDateStr}`, todos);
      renderDetailTodoList();
    }

    function handleDragEnd(e) {
      e.currentTarget.classList.remove('dragging');
      draggedIdx = null;
    }

    function addDetailTodo() {
      const inputEl = document.getElementById('new-todo-input');
      const text = inputEl.value.trim();
      if (!text) return;

      const todos = JSON.parse(localStorage.getItem(`daily_detail_${currentDetailDateStr}`)) || [];
      todos.push({ text: text, done: false, color: 'black' });

      syncSave(`daily_detail_${currentDetailDateStr}`, todos);
      inputEl.value = '';
      renderDetailTodoList();
    }

    function toggleDetailTodo(idx) {
      const todos = JSON.parse(localStorage.getItem(`daily_detail_${currentDetailDateStr}`)) || [];
      if (todos[idx]) {
        todos[idx].done = !todos[idx].done;
        syncSave(`daily_detail_${currentDetailDateStr}`, todos);
        renderDetailTodoList();
      }
    }

    function cycleTodoColor(idx) {
      const todos = JSON.parse(localStorage.getItem(`daily_detail_${currentDetailDateStr}`)) || [];
      if (todos[idx]) {
        const currentColor = todos[idx].color || 'black';
        let nextColor = 'red';
        if (currentColor === 'red') nextColor = 'blue';
        else if (currentColor === 'blue') nextColor = 'black';

        todos[idx].color = nextColor;
        syncSave(`daily_detail_${currentDetailDateStr}`, todos);
        renderDetailTodoList();
      }
    }

    function startEditTodo(idx) {
      editingTodoIdx = idx;
      renderDetailTodoList();
    }

    function saveEditedTodo(idx) {
      if (editingTodoIdx !== idx) return;
      const editInput = document.getElementById(`edit-todo-input-${idx}`);
      if (!editInput) return;

      const newText = editInput.value.trim();
      const todos = JSON.parse(localStorage.getItem(`daily_detail_${currentDetailDateStr}`)) || [];

      if (todos[idx]) {
        if (newText) {
          todos[idx].text = newText;
        }
        editingTodoIdx = -1;
        syncSave(`daily_detail_${currentDetailDateStr}`, todos);
        renderDetailTodoList();
      }
    }

    function deleteDetailTodo(idx) {
      const todos = JSON.parse(localStorage.getItem(`daily_detail_${currentDetailDateStr}`)) || [];
      todos.splice(idx, 1);
      editingTodoIdx = -1;
      syncSave(`daily_detail_${currentDetailDateStr}`, todos);
      renderDetailTodoList();
    }

    window.onload = function() {
      updateDday();
      initCategoryOptions();
      renderCalendar();
      initScheduleDatePicker();

      db.ref('quizlet_cards_v5').on('value', (snapshot) => {
        const val = snapshot.val();
        if (val) {
          cards = val;
          localStorage.setItem('quizlet_cards_v5', JSON.stringify(val));
        }
        filterQuizlet();
      });

      db.ref().on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          Object.keys(data).forEach(key => {
            if (key.startsWith('todos_v2_') || key.startsWith('daily_detail_')) {
              localStorage.setItem(key, typeof data[key] === 'object' ? JSON.stringify(data[key]) : data[key]);
            }
          });
        }
        renderCalendar();
        renderDetailTodoList();
      });

      document.addEventListener('keydown', function(event) {
        const quizletTab = document.getElementById('tab2');
        if (!quizletTab || !quizletTab.classList.contains('active')) return;

        const activeEl = document.activeElement;
        if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA' || activeEl.tagName === 'SELECT')) {
          return;
        }

        if (event.key === 'ArrowLeft') {
          event.preventDefault();
          prevCard();
        } else if (event.key === 'ArrowRight' || event.key === ' ') {
          event.preventDefault();
          nextCard();
        }
      });
    };
  </script>
</body>
</html>
